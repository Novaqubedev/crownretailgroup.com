<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crown Retail Group | Coming Soon</title>

  <meta name="description" content="Crown Retail Group – a growing business, committed to quality, value, and exceptional customer experience." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#0b1c2d;
      --gold:#c9a24d;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --border:#eef2f7;
      --shadow:rgba(11, 28, 45, 0.10);
    }

    *{ box-sizing:border-box; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:#ffffff;
      color:var(--text);
    }

    /* subtle premium top glow (no image) */
    body::before{
      content:"";
      position:fixed;
      inset:-40vh -20vw auto -20vw;
      height:60vh;
      background:
        radial-gradient(closest-side, rgba(201,162,77,0.18), transparent 70%),
        radial-gradient(closest-side, rgba(11,28,45,0.08), transparent 70%);
      pointer-events:none;
      filter: blur(10px);
    }

    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:42px 18px;
      position:relative;
    }

    .card{
      width:min(820px, 94vw);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:44px 34px 34px;
      box-shadow: 0 24px 60px var(--shadow);
      text-align:center;
    }

    /* logo badge prevents ugly white-canvas feel */
    .logo-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border-radius:18px;
      background:#ffffff;
      border:1px solid rgba(11,28,45,0.08);
      box-shadow: 0 10px 26px rgba(11,28,45,0.08);
      margin-bottom:22px;
    }

    .logo{
      height:56px;
      width:auto;
      display:block;
      object-fit:contain;
    }

    h1{
      font-family:"Playfair Display", serif;
      font-weight:600;
      font-size: clamp(34px, 4.2vw, 54px);
      margin: 8px 0 10px;
      color:var(--navy);
      letter-spacing: 0.4px;
    }

    .coming{
      display:inline-block;
      margin-top:6px;
      font-size: 13px;
      letter-spacing: 6px;
      font-weight: 500;
      color: var(--gold);
    }

    .divider{
      width:92px;
      height:2px;
      background: var(--gold);
      margin: 28px auto 22px;
      border-radius:999px;
    }

    p{
      max-width: 58ch;
      margin: 0 auto 28px;
      font-size: 18px;
      line-height: 1.7;
      color: var(--muted);
    }

    footer{
      margin-top: 6px;
      font-size: 13px;
      color: rgba(107,114,128,0.9);
    }

    @media (max-width: 520px){
      .card{ padding:34px 20px 22px; border-radius:20px; }
      .logo{ height:46px; }
      .coming{ letter-spacing:5px; }
      p{ font-size: 16.5px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <!-- Logo -->
      <div class="logo-badge">
        <img src="logo.png" alt="Crown Retail Group Logo" class="logo">
      </div>

      <h1>Crown Retail Group</h1>
      <div class="coming">COMING SOON</div>

      <div class="divider"></div>

      <p>
        We are a growing business, committed to quality, value, and exceptional customer experience.
      </p>

      <footer>
        © 2025 Crown Retail Group. All rights reserved.
      </footer>

    </section>
  </main>
</body>
</html>
