<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crown Retail Group | Coming Soon</title>

  <meta name="description" content="Crown Retail Group – Grocery Shopping Made Easy" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0b1c2d;
      --gold: #c9a24d;
      --text: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;

      /* BACKGROUND IMAGE */
      background: url("bg.png") center/cover no-repeat fixed;
      position: relative;
    }

    /* Dark premium overlay for readability */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(11, 28, 45, 0.78),
        rgba(11, 28, 45, 0.55)
      );
    }

    /* Subtle blur card */
    .card {
      position: relative; /* keeps it above overlay */
      width: min(680px, 92vw);
      padding: 42px 36px;
      border-radius: 18px;
      text-align: center;
      margin: 0 auto;

      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      position: relative; /* above overlay */
    }

    .logo {
      width: min(240px, 70vw);
      height: auto;
      margin-bottom: 26px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      margin: 0;
      color: var(--navy);
      letter-spacing: 0.5px;
    }

    .tag {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 5px;
      font-weight: 500;
      color: var(--gold);
    }

    .divider {
      width: 74px;
      height: 2px;
      background: var(--gold);
      margin: 28px auto;
      border-radius: 20px;
    }

    p {
      margin: 0 auto 34px;
      max-width: 46ch;
      font-size: 18px;
      line-height: 1.65;
      color: rgba(17, 24, 39, 0.78);
    }

    footer {
      font-size: 13px;
      color: rgba(17, 24, 39, 0.55);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">

      <img src="logo.png" alt="Crown Retail Group Logo" class="logo" />

      <h1>Crown Retail Group</h1>
      <div class="tag">COMING SOON</div>

      <div class="divider"></div>

      <p>
        We are a growing business, committed to quality, value, and exceptional customer experience.
      </p>

      <footer>© 2025 Crown Retail Group. All rights reserved.</footer>

    </section>
  </main>
</body>
</html>
