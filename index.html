<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crown Retail Group | Coming Soon</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crown Retail Group – a growing business, committed to quality, value, and exceptional customer experience.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #0b1c2d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 820px;
      width: 94%;
      padding: 56px 40px;
      border-radius: 26px;
      background: #ffffff;
      box-shadow: 0 30px 70px rgba(11, 28, 45, 0.12);
      text-align: center;
    }

    .logo {
      display: block;
      margin: 0 auto 32px;
      max-width: 300px;
      width: 100%;
      height: auto;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      margin: 0 0 14px;
      letter-spacing: 0.5px;
    }

    .coming-soon {
      font-size: 13px;
      letter-spacing: 6px;
      font-weight: 500;
      color: #c9a24d;
      margin-bottom: 22px;
    }

    .divider {
      width: 90px;
      height: 2px;
      background: #c9a24d;
      margin: 0 auto 26px;
    }

    p {
      max-width: 600px;
      margin: 0 auto 34px;
      font-size: 18px;
      line-height: 1.7;
      color: #6b7280;
    }

    footer {
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 40px;
      }
      .container {
        padding: 44px 22px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="logo.png" alt="Crown Retail Group Logo" class="logo">

    <h1>Crown Retail Group</h1>

    <div class="coming-soon">COMING SOON</div>
    <div class="divider"></div>

    <p>
      We are a growing business, committed to quality, value, and exceptional customer experience.
    </p>

    <footer>
      © 2025 Crown Retail Group. All rights reserved.
    </footer>

  </div>
</body>
</html>
