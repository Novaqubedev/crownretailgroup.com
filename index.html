<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crown Retail Group | Coming Soon</title>

  <!-- SEO -->
  <meta name="description" content="Crown Retail Group – a growing retail business committed to quality, value, and exceptional customer experience." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0b1c2d;
      --gold: #c9a24d;
      --grey: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: var(--navy);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }

    .logo {
      max-width: 220px;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin: 0;
      letter-spacing: 1px;
    }

    h2 {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 4px;
      color: var(--gold);
    }

    .divider {
      width: 70px;
      height: 2px;
      background: var(--gold);
      margin: 35px auto;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: var(--grey);
      margin-bottom: 50px;
    }

    footer {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- LOGO -->
    <img src="logo.png" alt="Crown Retail Group Logo" class="logo" />

    <h1>Crown Retail Group</h1>
    <h2>COMING SOON</h2>

    <div class="divider"></div>

    <p>
      We are a growing business, committed to quality, value, and
      exceptional customer experience.
    </p>

    <footer>
      © 2025 Crown Retail Group. All rights reserved.
    </footer>

  </div>

</body>
</html>
